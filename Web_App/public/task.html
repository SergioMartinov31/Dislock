<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Критерий Поста</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet"
    />
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <link rel="stylesheet" href="../src/common.css" />
    <link rel="stylesheet" href="../src/task.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header__inner">
                <h1 class="logo">Критерий Поста</h1>
                <button onclick="restartTask()" class="header-restart-btn">Начать заново</button>
            </div>
        </div>
    </header>
    <main class="main">
        <div class="container">
            <div class="content">
                <p class="main-text">Функция: <span id="funcDisplay"></span></p>
                <h2 class="main-text">Таблица истинности</h2>
                <table id="truthTable"></table>
                <div class="button-container">
                    <button class="main_btn_start" onclick="checkTruthTable()">Проверить</button>
                </div>
            </div>
            <div id="postSection" style="display: none;">
                <div class="content">
                    <h2 class="main-text">Таблица Поста</h2>
                    <table id="postTable"></table>
                    <div class="button-container">
                        <button class="main_btn_start" onclick="checkPostTable()">Проверить</button>
                    </div>
                </div>
            </div>
            <div id="questionsSection" style="display: none;">
                <div class="content">
                    <h2 class="main-text">Вопросы</h2>
                    <div id="questions"></div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <h4 class="footer-author">Дискретная математика</h4>
    </footer>

    <!-- Модальное окно -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <h2>Ты справился!</h2>
            <button onclick="finishTask()" class="modal-finish-btn">Завершить выполнение</button>
        </div>
    </div>

    <script src="../src/script.js"></script>
</body>
</html>
